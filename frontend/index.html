<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Tasks - To-Do App</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <h1>📝 My Tasks</h1>
    <div class="user-info">
      <span id="welcome-text"></span>
      <button class="btn-logout" id="logout-btn">Log out</button>
    </div>
  </div>

  <div class="container">

    <!-- Add task -->
    <div class="new-task-card">
      <h2 class="add-task-heading">
  <span class="add-task-icon">➕</span>
  Add a new task
</h2>
      <form id="task-form">
        <label for="title">Title</label>
        <input type="text" id="title" required placeholder="e.g. Finish project report">

        <label for="description">Description (optional)</label>
        <textarea id="description" rows="2" placeholder="Any details..."></textarea>

<div class="form-row">
  <div>
    <label for="priority">Priority</label>
    <select id="priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
  </div>

  <div>
    <label for="category">Category</label>
    <select id="category">
      <option value="Study">📚 Study</option>
      <option value="Work">💼 Work</option>
      <option value="Personal">🏠 Personal</option>
      <option value="Shopping">🛒 Shopping</option>
      <option value="Other" selected>🎯 Other</option>
    </select>
  </div>
</div>

<label for="due_date">Due date (optional)</label>
<input type="date" id="due_date">

        <button type="submit" class="btn-primary">Add Task</button>
        <div class="error-box" id="form-error"></div>
      </form>
    </div>

    <div class="stat-box">
  <div class="stat-icon">📋</div>
  <h3>Total Tasks</h3>
  <p id="total-count">0</p>
  <span>All your tasks</span>
</div>

<div class="stat-box">
  <div class="stat-icon">✅</div>
  <h3>Completed</h3>
  <p id="completed-count">0</p>
  <span>Tasks finished</span>
</div>

<div class="stat-box">
  <div class="stat-icon">⏳</div>
  <h3>Pending</h3>
  <p id="pending-count">0</p>
  <span>Tasks remaining</span>
</div>

<!-- Today's Smart Focus -->
<div class="smart-focus-card" id="smart-focus-card">
  <div class="smart-focus-icon">🎯</div>

  <div class="smart-focus-content">
    <h2>Today's Smart Focus</h2>
    <p class="smart-focus-subtitle">
      Your most important pending task
    </p>

    <div id="smart-task-content">
      <h3 id="smart-task-title">No pending tasks 🎉</h3>

      <div class="smart-task-details">
        <span id="smart-task-priority"></span>
        <span id="smart-task-category"></span>
        <span id="smart-task-due"></span>
      </div>
    </div>

    <button id="focus-btn" class="focus-btn" style="display:none;">
      Start This Task →
    </button>
  </div>
</div>

    <!-- Search -->
    <div class="search-container">
      <input
       type="text"
       id="search-input"
       placeholder="🔍 Search tasks..."
      >
    </div>
    <!-- Filters -->
    <div class="filters">
      <select id="filter-status">
        <option value="">All tasks</option>
        <option value="false">Active</option>
        <option value="true">Completed</option>
      </select>
      <select id="filter-priority">
        <option value="">Any priority</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select id="sort-by">
        <option value="created_at">Sort: Newest</option>
        <option value="due_date">Sort: Due date</option>
        <option value="priority">Sort: Priority</option>
      </select>
    </div>

    <!-- Task list -->
    <ul class="task-list" id="task-list"></ul>
    <div class="empty-state" id="empty-state" style="display:none;">No tasks yet. Add one above! 🎉</div>
  </div>

  <!-- Edit modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <h2>Edit Task</h2>
      <form id="edit-form">
        <input type="hidden" id="edit-id">

        <label for="edit-title">Title</label>
        <input type="text" id="edit-title" required>

        <label for="edit-description">Description</label>
        <textarea id="edit-description" rows="2"></textarea>

        <div class="form-row">
  <div>
    <label for="edit-priority">Priority</label>
    <select id="edit-priority">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
  </div>

  <div>
    <label for="edit-category">Category</label>
    <select id="edit-category">
      <option value="Study">📚 Study</option>
      <option value="Work">💼 Work</option>
      <option value="Personal">🏠 Personal</option>
      <option value="Shopping">🛒 Shopping</option>
      <option value="Other" selected>🎯 Other</option>
    </select>
  </div>
</div>

<label for="edit-due_date">Due date</label>
<input type="date" id="edit-due_date">

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancel-edit">Cancel</button>
          <button type="submit" class="btn-save">Save changes</button>
        </div>
        <div class="error-box" id="edit-error"></div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
