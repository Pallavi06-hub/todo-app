<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - To-Do App</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Create account</h1>
      <p class="subtitle">Start organizing your tasks</p>

      <form id="register-form">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3" placeholder="jdoe">

        <label for="email">Email</label>
        <input type="email" id="email" required pattern="[a-zA-Z0-9._%+-]+@gmail\.com" placeholder="you@gmail.com">

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" placeholder="8+ chars, Aa1@">

        <button type="submit" class="btn-primary">Sign Up</button>
        <div class="error-box" id="error-box"></div>
      </form>

      <p class="switch-link">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById("register-form");
    const errorBox = document.getElementById("error-box");

    form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.style.display = "none";

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const emailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
  const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}$/;

  if (!emailPattern.test(email)) {
    errorBox.textContent = "Email must end with @gmail.com";
    errorBox.style.display = "block";
    return;
  }

  if (!passwordPattern.test(password)) {
    errorBox.textContent =
      "Password must be at least 8 characters and contain uppercase, lowercase, number, and special character.";
    errorBox.style.display = "block";
    return;
  }

  try {
    await api.register(username, email, password);
    window.location.href = "index.html";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = "block";
  }
});

    // If already logged in, skip straight to the dashboard
    api.me().then((res) => { if (res.authenticated) window.location.href = "index.html"; });
  </script>
</body>
</html>
