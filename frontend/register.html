<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - To-Do App</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Create account</h1>
      <p class="subtitle">Start organizing your tasks</p>

      <form id="register-form">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3" placeholder="jdoe">

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">

        <button type="submit" class="btn-primary">Sign Up</button>
        <div class="error-box" id="error-box"></div>
      </form>

      <p class="switch-link">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById("register-form");
    const errorBox = document.getElementById("error-box");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await api.register(username, email, password);
        window.location.href = "index.html";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
      }
    });

    // If already logged in, skip straight to the dashboard
    api.me().then((res) => { if (res.authenticated) window.location.href = "index.html"; });
  </script>
</body>
</html>
